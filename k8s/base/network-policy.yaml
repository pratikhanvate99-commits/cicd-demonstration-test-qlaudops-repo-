apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: qlaudops-default-deny-ingress
  namespace: qlaudops
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: qlaudops
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8000
