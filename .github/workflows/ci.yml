name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt bandit pip-audit
      - run: python -m compileall -q app
      - run: python -m pytest -q
      - run: bandit -q -r app
      - run: pip-audit -r requirements-dev.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
      - run: terraform fmt -check -recursive terraform
      - run: terraform -chdir=terraform/environments/demo init -backend=false -input=false
      - run: terraform -chdir=terraform/environments/demo validate
      - uses: azure/setup-kubectl@v5
        with:
          version: v1.34.0
      - name: Render development manifests
        run: kubectl kustomize k8s/overlays/development > "$RUNNER_TEMP/qlaudops-manifests.yaml"
      - name: Validate rendered Kubernetes manifests
        run: docker run --rm -v "$RUNNER_TEMP/qlaudops-manifests.yaml:/manifests.yaml:ro" ghcr.io/yannh/kubeconform:v0.8.0 -strict -summary /manifests.yaml

  image:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: qlaudops:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: qlaudops:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, infrastructure, image]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: echo "All validation passed. Add an approved registry and deploy job before enabling release publishing."
